
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moto Boy Controle</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
  padding: 20px;
}
input, button {
  font-size: 20px;
  padding: 12px;
  margin: 8px;
  border-radius: 8px;
}
button {
  background: #19c37d;
  border: 0;
}
</style>
</head>
<body>
<h2>💰 CONTROLE MOTO BOY</h2>

<input id="valor" type="text" inputmode="decimal"
placeholder="Valor da entrega (ex.: 12,30)">

<button onclick="adicionar()">Adicionar entrega</button>
<button onclick="zerarSaldo()" style="background:#e53935;color:white;">Zerar saldo do dia</button>
<h3>Última entrega: R$ <span id="ultima">0,00</span></h3>
<h2>Total do dia: R$ <span id="total">0,00</span></h2>
<p>Entregas: <span id="qtd">0</span></p>


<script>
const SUPABASE_URL = "https://iuymhjvmwzjaiffcjydj.supabase.co";
const SUPABASE_KEY = "sb_publishable_kclm0EsnSAd2ahMdGX9hJw_v67UMx1F";

let total = 0;
let qtd = 0;

function moeda(n) {
  return Number(n).toLocaleString("pt-BR", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function mostrar(totalAtual, ultimaAtual, qtdAtual) {
  total = Number(totalAtual);
  qtd = Number(qtdAtual);

  document.getElementById("ultima").textContent = moeda(ultimaAtual);
  document.getElementById("total").textContent = moeda(total);
  document.getElementById("qtd").textContent = qtd;
}

async function carregar() {
  const resposta = await fetch(
    `${SUPABASE_URL}/rest/v1/saldo_dia?id=eq.1&select=*`,
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    }
  );

  if (!resposta.ok) {
    throw new Error("Não foi possível carregar o saldo.");
  }

  const dados = await resposta.json();

  if (dados.length > 0) {
    mostrar(dados[0].total, dados[0].ultima, dados[0].quantidade);
  }
}

async function adicionar() {
  const campo = document.getElementById("valor");
  const texto = campo.value.trim().replace(/\s/g, "");
  let v;

  if (texto.includes(",")) {
    v = Number(texto.replace(/\./g, "").replace(",", "."));
  } else {
    v = Number(texto);
  }

  if (!Number.isFinite(v) || v <= 0) {
    alert("Digite um valor válido, como 12,30");
    return;
  }

  try {
    await carregar();

    const novoTotal = total + v;
    const novaQtd = qtd + 1;

    const resposta = await fetch(
      `${SUPABASE_URL}/rest/v1/saldo_dia?id=eq.1`,
      {
        method: "PATCH",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          Prefer: "return=representation"
        },
        body: JSON.stringify({
          total: novoTotal,
          ultima: v,
          quantidade: novaQtd,
          atualizado_em: new Date().toISOString()
        })
      }
    );

    if (!resposta.ok) {
      throw new Error("Não foi possível salvar a entrega.");
    }

    mostrar(novoTotal, v, novaQtd);
    campo.value = "";
  } catch (erro) {
    alert("Erro ao salvar. Confira a URL, a chave e a conexão.");
    console.error(erro);
  }
}
async function zerarSaldo() {
  if (!confirm("Tem certeza que deseja zerar o saldo do dia?")) {
    return;
  }

  try {
    const resposta = await fetch(
      `${SUPABASE_URL}/rest/v1/saldo_dia?id=eq.1`,
      {
        method: "PATCH",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          Prefer: "return=minimal"
        },
        body: JSON.stringify({
          total: 0,
          ultima: 0,
          quantidade: 0,
          atualizado_em: new Date().toISOString()
        })
      }
    );

    if (!resposta.ok) {
      throw new Error("Não foi possível zerar o saldo.");
    }

    mostrar(0, 0, 0);
    alert("Saldo zerado com sucesso!");
  } catch (erro) {
    alert("Erro ao zerar o saldo. Tente novamente.");
    console.error(erro);
  }
}
carregar().catch(erro => {
  console.error(erro);
  alert("Não foi possível conectar ao saldo online.");
});
</script>
</body>
</html>
